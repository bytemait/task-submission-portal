name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, task-submission-portal]
    environment: production
    permissions:
      packages: read
    steps:
      - name: Deploy and verify health
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /opt/task-submission-portal
          test -s .env
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          previous_tag="$(cat .previous-image-tag 2>/dev/null || true)"
          export IMAGE_TAG
          if ! docker compose -p task-submission-portal up -d --pull always --wait --wait-timeout 90 || ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3002/api/health; then
            if [ -n "$previous_tag" ]; then
              IMAGE_TAG="$previous_tag" docker compose -p task-submission-portal up -d --pull always --wait --wait-timeout 90 || true
            fi
            exit 1
          fi
          printf '%s' "$IMAGE_TAG" > .previous-image-tag.tmp
          mv .previous-image-tag.tmp .previous-image-tag
